{% extends "base.html" %}
{% block title %}New flashcards{% endblock %}
{% block content %}
<h1>New flashcards</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form class="form" method="post" action="{{ url_for('deck_new') }}">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" value="{{ name }}" maxlength="{{ max_length }}" required autofocus>
  <p class="muted">If flashcards with this name exist, you can add cards to them.</p>
  <button type="submit" class="button">Create</button>
</form>
<p><a href="{{ url_for('home') }}">Back to flashcards</a></p>
{% endblock %}
