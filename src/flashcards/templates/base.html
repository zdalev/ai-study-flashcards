<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Flashcards{% endblock %} - AI study flashcards</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container{% block width %}{% endblock %}">
      <a class="brand" href="{{ url_for('home') }}">AI study flashcards</a>
      <nav>
        <a href="{{ url_for('home') }}">Home</a>
      </nav>
    </div>
  </header>
  <main class="container{{ self.width() }}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
